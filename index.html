<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 단어 암기 프로그램</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f0f4f8;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%; max-width: 650px;
        }
        h1 { text-align: center; color: #1e293b; font-size: 24px; margin-top: 0; margin-bottom: 20px; }
        .quiz-info {
            display: flex; justify-content: space-between;
            color: #64748b; font-size: 15px; margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-weight: 600;
        }
        .question-box {
            background-color: #f8fafc; padding: 25px;
            border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0;
            min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .question-type-badge {
            display: inline-block; background-color: #e2e8f0; color: #475569;
            font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: bold; margin-bottom: 10px;
        }
        .word-title {
            font-size: 28px; font-weight: bold; color: #0f172a; text-align: center;
        }
        .sentence-text {
            font-size: 18px; color: #334155; line-height: 1.6; text-align: center; word-break: keep-all;
        }
        .options-container {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
        }
        .option-btn {
            background-color: #ffffff; border: 2px solid #e2e8f0;
            padding: 14px 18px; border-radius: 10px; font-size: 16px;
            text-align: left; cursor: pointer; transition: all 0.2s ease;
            color: #1e293b; font-weight: 500;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
        }
        .option-btn.correct {
            background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important;
        }
        .next-btn, .action-btn {
            background-color: #2563eb; color: white; border: none;
            width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
            border-radius: 10px; cursor: pointer; transition: background-color 0.2s;
        }
        .next-btn:hover, .action-btn:hover { background-color: #1d4ed8; }
        .result-box { display: none; }
        .wrong-notes-list {
            background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 15px; max-height: 250px; overflow-y: auto; text-align: left; margin: 15px 0;
        }
        .wrong-item {
            padding: 8px 0; border-bottom: 1px solid #cbd5e1; font-size: 15px; color: #334155;
        }
        .wrong-item:last-child { border-bottom: none; }
        .wrong-word { font-weight: bold; color: #dc2626; display: inline-block; width: 140px; }
        .history-box {
            margin-top: 25px; border-top: 2px dashed #e2e8f0; padding-top: 15px; text-align: left;
        }
        .history-title { font-size: 16px; font-weight: bold; color: #475569; margin-bottom: 10px; }
        .history-item { font-size: 14px; color: #64748b; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 통합 단어 암기 프로그램</h1>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen">
        <div class="quiz-info">
            <span id="stage-text" style="color: #2563eb;">[1차 전체 풀이]</span>
            <span id="progress-text">문제 1 / 89</span>
            <span id="score-text">맞힌 개수: 0 / 89</span>
        </div>

        <div class="question-box">
            <div id="question-badge" class="question-type-badge">유형</div>
            <div id="question-content">
                <!-- 문제 들어갈 자리 -->
            </div>
        </div>

        <div class="options-container" id="options-container">
            <!-- 선지 4개 -->
        </div>

        <button id="next-btn" class="next-btn" style="display: none;" onclick="nextQuestion()">다음 문제</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-box">
        <h2 id="result-title" style="text-align: center; color: #1e293b;">🎉 학습 결과</h2>
        <p id="final-summary" style="text-align: center; font-size: 18px; color: #334155; margin: 15px 0;"></p>

        <!-- 틀린 단어 정리 노드가 들어갈 자리 -->
        <div id="wrong-note-container" style="display: none;">
            <h3 style="font-size: 16px; color: #dc2626; margin-bottom: 8px;">📌 최종 틀린 단어 정리</h3>
            <div id="wrong-notes-list" class="wrong-notes-list"></div>
        </div>

        <div style="margin-top: 20px;">
            <button id="re-quiz-btn" class="action-btn" style="background-color: #dc2626; display: none; margin-bottom: 10px;" onclick="startWrongQuiz()">🔄 틀린 문제 다시 풀기</button>
            <button id="restart-btn" class="action-btn" style="background-color: #10b981;" onclick="restartAll()">✨ 처음부터 다시 시작하기</button>
        </div>

        <!-- 누적 학습 기록 -->
        <div class="history-box">
            <div class="history-title">📜 누적 학습 기록</div>
            <div id="history-list">
                <div class="history-item">아직 기록이 없습니다.</div>
            </div>
        </div>
    </div>
</div>

        { word: "afflicted", korean: "괴로움을 겪는, 고통받는", sentence: "Knowing that Mrs. Mallard was afflicted with heart trouble, they broke the news gently." },

        { word: "repression", korean: "억압, 억제", sentence: "Her face showed lines of restraint and repression." },
        { word: "yonder", korean: "저쪽에", sentence: "She looked out at the blue sky yonder." },
        { word: "suspension", korean: "일시적으로 중단함", sentence: "There was a temporary suspension of all sound." },
        { word: "subtle", korean: "미묘한, 섬세한", sentence: "She felt a subtle change approaching her." },
        { word: "elusive", korean: "찾기/이해하기 어려운", sentence: "The feeling was too elusive to name immediately." },

        { word: "monstrous", korean: "흉측한, 끔찍한", sentence: "She wondered if it was a monstrous joy that held her." },
        { word: "exalted", korean: "높은 지위의, 큰 기쁨의", sentence: "A clear and exalted perception filled her mind." },
        { word: "dismiss", korean: "묵살하다, 해고하다", sentence: "She dismissed the thought as trivial." },
        { word: "trivial", korean: "사소한, 중요하지 않은", sentence: "It was a trivial detail in the larger context." },
        { word: "persistence", korean: "끈기, 인내", sentence: "She admired his persistence despite the hardship." },
        { word: "illumination", korean: "빛, 조명, 깨달음", sentence: "A sudden illumination revealed the truth to her." },
        { word: "self-assertion", korean: "자기 주장, 자신감", sentence: "Possession of self-assertion was her strongest impulse." },
        { word: "impulse", korean: "충동", sentence: "She acted on a sudden impulse of freedom." },
        { word: "implore", korean: "간청하다, 애원하다", sentence: "Her sister implored her to open the door." },
        { word: "elixir", korean: "영약, 만병통치약", sentence: "She was drinking in a very elixir of life." },
        { word: "run riot", korean: "제멋대로 뻗어나가다", sentence: "Her fancy was running riot along those days ahead." },
        { word: "shudder", korean: "몸서리, 전율", sentence: "A shudder of cold fear passed through her." },
        { word: "importunity", korean: "끈질긴 부탁, 집요함", sentence: "She opened the door at last to her sister's importunity." },
        { word: "feverish", korean: "열광적인, 열이 있는 듯한", sentence: "There was a feverish triumph in her eyes." },
        { word: "unwittingly", korean: "자신도 모르게, 무의식적으로", sentence: "She unwittingly walked straight into the room." },
        { word: "descend", korean: "내려가다, 내려오다", sentence: "They began to descend the stairs together." },
        { word: "composedly", korean: "침착하게", sentence: "She answered the question calmly and composedly." }
    ];

    let currentQuestions = [];
    let wrongQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let answered = false;
    let isWrongMode = false;
    let historyLogs = [];

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function restartAll() {
        isWrongMode = false;
        wrongQuestions = [];
        currentQuestions = shuffle(vocabList);
        startQuiz();
    }

    function startWrongQuiz() {
        isWrongMode = true;
        currentQuestions = shuffle([...wrongQuestions]);
        wrongQuestions = []; // 재풀이 중 새로 틀린 것 기록 위해 초기화
        startQuiz();
    }

    function startQuiz() {
        currentIndex = 0;
        correctCount = 0;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        
        document.getElementById('stage-text').innerText = isWrongMode ? "[🔥 오답 재풀이]" : "[1차 전체 풀이]";
        document.getElementById('stage-text').style.color = isWrongMode ? "#dc2626" : "#2563eb";

        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        document.getElementById('next-btn').style.display = 'none';
        
        const qData = currentQuestions[currentIndex];
        document.getElementById('progress-text').innerText = `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('score-text').innerText = `맞힌 개수: ${correctCount} / ${currentQuestions.length}`;

        // 50% 확률로 문제 유형 결정 (1: 뜻 맞히기, 2: 예문 빈칸 맞히기)
        const qType = Math.random() < 0.5 ? 1 : 2;
        
        const badge = document.getElementById('question-badge');
        const qContent = document.getElementById('question-content');
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        let correctAnswerText = "";
        let options = [];

        if (qType === 1) {
            badge.innerText = "유형 1 : 단어의 뜻 고르기";
            badge.style.backgroundColor = "#e0e7ff";
            badge.style.color = "#3730a3";
            qContent.innerHTML = `<div class="word-title">${qData.word}</div>`;
            correctAnswerText = qData.korean;

            // 매번 무작위로 다른 오답 3개 선지 추출
            let wrongPool = vocabList.filter(item => item.korean !== qData.korean);
            let wrongOptions = shuffle(wrongPool).slice(0, 3).map(item => item.korean);
            options = shuffle([correctAnswerText, ...wrongOptions]);

        } else {
            badge.innerText = "유형 2 : 예문 빈칸 고르기";
            badge.style.backgroundColor = "#fef3c7";
            badge.style.color = "#92400e";
            
            const regex = new RegExp(qData.word, 'gi');
            const blankSentence = qData.sentence.replace(regex, '___');
            
            qContent.innerHTML = `<div class="sentence-text">"${blankSentence}"</div>`;
            correctAnswerText = qData.word;

            // 매번 무작위로 다른 오답 3개 선지 추출
            let wrongPool = vocabList.filter(item => item.word !== qData.word);
            let wrongOptions = shuffle(wrongPool).slice(0, 3).map(item => item.word);
            options = shuffle([correctAnswerText, ...wrongOptions]);
        }

        options.forEach((optText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `선지 ${index + 1} : ${optText}`;
            btn.onclick = () => selectOption(btn, optText, correctAnswerText, qData);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedBtn, selectedText, correctText, qData) {
        if (answered) return;
        answered = true;

        const buttons = document.querySelectorAll('.option-btn');
        let isCorrect = selectedText === correctText;

        buttons.forEach(btn => {
            if (btn.innerText.includes(correctText)) {
                btn.classList.add('correct');
            }
            if (btn === selectedBtn && !isCorrect) {
                btn.classList.add('incorrect');
            }
            btn.disabled = true;
        });

        if (isCorrect) {
            correctCount++;
            document.getElementById('score-text').innerText = `맞힌 개수: ${correctCount} / ${currentQuestions.length}`;
        } else {
            // 중복 방지하여 오답 목록에 추가
            if (!wrongQuestions.some(item => item.word === qData.word)) {
                wrongQuestions.push(qData);
            }
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentIndex < currentQuestions.length - 1) ? "다음 문제" : "결과 보기";
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const total = currentQuestions.length;
        const finalSummary = document.getElementById('final-summary');
        const reQuizBtn = document.getElementById('re-quiz-btn');
        const wrongNoteContainer = document.getElementById('wrong-note-container');
        const wrongNotesList = document.getElementById('wrong-notes-list');

        finalSummary.innerHTML = `이번 풀이 결과: <strong>${total}문제</strong> 중 <strong>${correctCount}문제</strong> 정답!`;

        // 히스토리 추가
        const now = new Date().toLocaleTimeString();
        const stageName = isWrongMode ? "오답 재풀이" : "1차 풀이";
        historyLogs.unshift(`[${now}] ${stageName} - ${total}문제 중 ${correctCount}개 정답 (오답 ${wrongQuestions.length}개)`);
        updateHistoryUI();

        // 틀린 문제가 있는 경우
        if (wrongQuestions.length > 0) {
            reQuizBtn.style.display = 'block';
            reQuizBtn.innerText = `🔄 틀린 문제 (${wrongQuestions.length}개) 다시 풀기`;

            // 오답 노트 요약 노출 ("영어 단어 : 한글 뜻")
            wrongNoteContainer.style.display = 'block';
            wrongNotesList.innerHTML = '';
            wrongQuestions.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `<span class="wrong-word">${item.word}</span> : ${item.korean}`;
                wrongNotesList.appendChild(div);
            });
        } else {
            reQuizBtn.style.display = 'none';
            wrongNoteContainer.style.display = 'none';
            finalSummary.innerHTML += `<br><span style="color: #16a34a; font-weight: bold;">🎉 모든 문제를 완벽하게 다 맞히셨습니다!</span>`;
        }
    }

    function updateHistoryUI() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';
        historyLogs.forEach(log => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerText = log;
            historyList.appendChild(item);
        });
    }

    window.onload = restartAll;
</script>

</body>
</html>
